<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <clipPath id="square-clip">
      <rect width="500" height="500" rx="40" ry="40" />
    </clipPath>
  </defs>
  <g clip-path="url(#square-clip)">
    <!-- Background Blue -->
    <rect width="500" height="500" fill="#0066b2" />
    <!-- Grey Diagonal Bottom Right -->
    <polygon points="250,500 500,250 500,500" fill="#808285" />
    <!-- Text ECS -->
    <text x="250" y="320" 
          font-family="Arial, Helvetica, sans-serif" 
          font-weight="900" 
          font-size="210" 
          fill="#ffffff" 
          text-anchor="middle" 
          letter-spacing="-5">ECS</text>
  </g>
</svg>
